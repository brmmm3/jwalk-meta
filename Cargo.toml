[package]
name = "jwalk-meta"
version = "1.1.3"
authors = ["Jesse Grosjean <jesse@hogbaysoftware.com>", "Sebastian Thiel <byronimo@gmail.com>", "Martin Bammer <mrbm74@gmail.com>"]
description = "Filesystem walk performed in parallel with streamed and sorted results."
documentation = "https://docs.rs/jwalk-meta/"
homepage = "https://brmmm3.github.io/jwalk-meta"
repository = "https://github.com/brmmm3/jwalk-meta"
readme = "README.md"
keywords = ["directory", "recursive", "walk", "iterator", "parallel"]
categories = ["filesystem", "concurrency"]
license = "MIT"
edition = "2024"

[features]
default = []
# When enabled, force Unix to use the std::fs::read_dir fallback for benchmark comparisons.
# When disabled, Linux uses the direct getdents64 path.
legacy-read-dir = []
windows-only = []  # Windows-only examples (class77_poc, test_ft); enable with --features windows-only.

[[example]]
name = "class77_poc"
required-features = ["windows-only"]

[[example]]
name = "test_ft"
required-features = ["windows-only"]

[badges]
travis-ci = { repository = "brmmm3/jwalk-meta" }

[dependencies]
rayon = "1.10"
crossbeam = "0.8"
smallvec = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["std", "winioctl", "ioapiset", "fileapi", "minwinbase", "handleapi", "libloaderapi", "winbase"] }

[target.'cfg(unix)'.dependencies]
libc =  "0.2"

# Linux io_uring batched STATX support (Linux only).
# Kernel requirements: 5.6+ (statx opcode), 5.18+ (setup_submit_all).
# This dependency is still included, but unused, when the legacy-read-dir feature is enabled
# (Cargo cannot condition dependencies on features in target.cfg.dependencies).
# The architecture allowlist matches the upstream io-uring crate (src/sys/mod.rs:18-33):
# io-uring 0.7.x prebuilt sys.rs supports only these five architectures; others trigger compile_error.
[target.'cfg(all(target_os = "linux", target_env = "gnu", any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "riscv64", target_arch = "loongarch64", target_arch = "powerpc64")))'.dependencies]
io-uring = "0.7"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
fs_extra = "1.3"
walkdir = "2.5"
ignore = "0.4"
tempfile = "3.10"
num_cpus = "1.16"
lazy_static = "1.4"
reqwest = { version = "0.13", features = ["blocking"] }
flate2 = "1.0"
tar = "0.4"

[[bench]]
name = "walk_benchmark"
harness = false
